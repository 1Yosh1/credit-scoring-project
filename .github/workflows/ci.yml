name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt pytest httpx ruff
          # Install the project itself so `import src.*` resolves for the
          # bare `pytest` console script (which does not add cwd to sys.path)
          pip install --no-deps -e .

      - name: Lint
        run: ruff check src scripts tests

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t credit-scoring-api:ci .
