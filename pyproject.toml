[project]
name = "credit-scoring-service"
version = "1.1.0"
description = "Credit risk scoring service: XGBoost model served via FastAPI with a Streamlit dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # long lines allowed in notebooks/comments
]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E", "W", "F", "I", "B", "UP"]
"src/app.py" = ["B008"]  # Depends() in defaults is the standard FastAPI pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
