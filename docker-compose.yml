services:
  # --- The "Brain": FastAPI inference service -----------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: credit-scoring-api
    container_name: credit-api
    ports:
      - "80:80"
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - credit-network

  # --- The "Face": Streamlit dashboard for loan officers -------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: credit-scoring-dashboard
    container_name: credit-dashboard
    ports:
      - "8501:8501"
    environment:
      # Inside the compose network, the API is reachable as 'backend'
      - API_URL=http://backend:80/predict
      - API_URL_BASE=http://backend:80
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8501"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - credit-network

networks:
  credit-network:
    driver: bridge
